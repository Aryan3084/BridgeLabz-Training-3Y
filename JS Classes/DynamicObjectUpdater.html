<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Object Updater</title>
<style>
  input { display: block; margin: 8px 0; padding: 5px; width: 200px; }
  button { margin-top: 10px; padding: 5px 10px; }
  #userDetails { margin-top: 15px; font-weight: bold; }
</style>
</head>
<body>

<h2>Update User Information</h2>
<form id="userForm" novalidate>
  <label>Name: <input type="text" id="name" value="John"></label>
  <label>Email: <input type="email" id="email" value="john@mail.com"></label>
  <label>Age: <input type="number" id="age" value="21"></label>
  <button type="submit">Update</button>
</form>

<div id="userDetails"></div>

<script>
"use strict";

// Initial user object
const user = {
    name: "John",
    email: "john@mail.com",
    age: 21
};

// Form elements
const form = document.getElementById("userForm");
const nameInput = document.getElementById("name");
const emailInput = document.getElementById("email");
const ageInput = document.getElementById("age");
const userDetailsDiv = document.getElementById("userDetails");

// Function to display user object
function displayUser() {
    userDetailsDiv.textContent = `User Details: Name: ${user.name}, Email: ${user.email}, Age: ${user.age}`;
}

// Initial display
displayUser();

// Update user object on form submission
form.addEventListener("submit", function(e) {
    e.preventDefault();
    user.name = nameInput.value;
    user.email = emailInput.value;
    user.age = Number(ageInput.value);
    displayUser();
});
</script>

</body>
</html>
